<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Test mouches</title>
<style>html,body{margin:0;height:100%;background:#0b141c;overflow:hidden}#root{position:absolute;inset:0}</style>
</head><body>
<div id="root"></div>
<script>
if (location.search.indexOf('fast') >= 0) {
  // accélère le temps pour tester la fin de partie
  let fakeNow = 0;
  window.requestAnimationFrame = (cb) => setTimeout(() => { fakeNow += 50; cb(fakeNow); }, 2);
  window.cancelAnimationFrame = (id) => clearTimeout(id);
}
</script>
<script src="../games/mouches.js"></script>
<script>
window.__over = [];
window.__cele = [];
function fakeHead(skin, hair, mood, sad) {
  const c = document.createElement('canvas'); c.width = 160; c.height = 200;
  const g = c.getContext('2d');
  g.fillStyle = skin; g.beginPath(); g.ellipse(80, 108, 62, 80, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = hair; g.beginPath(); g.ellipse(80, 50, 66, 40, 0, Math.PI, 0); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(56, 100, 13, 0, 7); g.arc(104, 100, 13, 0, 7); g.fill();
  g.fillStyle = '#222'; g.beginPath(); g.arc(58, 102, 6, 0, 7); g.arc(102, 102, 6, 0, 7); g.fill();
  g.strokeStyle = '#7a2a2a'; g.lineWidth = 6; g.lineCap = 'round';
  if (!sad) { g.beginPath(); g.arc(80, 140, mood, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke(); return c; }
  // version triste : bouche à l'envers, larmes, teinte bleue, petit nuage de pluie
  g.beginPath(); g.arc(80, 168, 20, 1.2 * Math.PI, 1.8 * Math.PI); g.stroke();
  g.globalCompositeOperation = 'source-atop';
  g.fillStyle = 'rgba(70,120,220,0.28)'; g.fillRect(0, 0, 160, 200);
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#5ec8ff';
  for (const x of [52, 108]) { g.beginPath(); g.moveTo(x, 114); g.quadraticCurveTo(x + 9, 136, x, 144); g.quadraticCurveTo(x - 9, 136, x, 114); g.fill(); }
  g.fillStyle = '#9fb3c4';
  g.beginPath(); g.arc(60, 18, 14, 0, 7); g.arc(80, 12, 17, 0, 7); g.arc(102, 18, 13, 0, 7); g.fill();
  g.strokeStyle = '#5ec8ff'; g.lineWidth = 3;
  for (const x of [62, 80, 98]) { g.beginPath(); g.moveTo(x, 30); g.lineTo(x - 3, 40); g.stroke(); }
  return c;
}
function fakeFriend(name, skin, hair, mood, noSad) {
  const f = { name, img: fakeHead(skin, hair, mood, false) };
  if (!noSad) f.sad = fakeHead(skin, hair, mood, true);
  return f;
}
// ?heads → 3 fausses têtes avec `sad` (+ &nosad : Momo sans `sad`, pour tester le repli sur img) ; sans ?heads → aucune tête
const HEADS = location.search.indexOf('heads') >= 0 ? [
  fakeFriend('PATOU', '#f2c39b', '#5a3a1a', 22),
  fakeFriend('Juju', '#c98b5e', '#1a1a1a', 26),
  fakeFriend('Momo', '#ffd9c0', '#d9902a', 18, location.search.indexOf('nosad') >= 0)
] : [];
const api = {
  heads: () => HEADS.slice(),
  player: { name: 'PATOU', img: HEADS[0] ? HEADS[0].img : null },
  celebrate(text, name) { console.log('CELEBRATE', text, name || ''); window.__cele.push(text); },
  gameOver(s) { console.log('GAMEOVER', s); window.__over.push(s); },
  audio: { tone() {}, noise() {} },
  fonts: { display: "'Bungee', Impact, sans-serif", body: "'Chakra Petch', system-ui, sans-serif" },
  colors: {}
};
// départ à un niveau et graine (outils de test, CONTRACT.md Ajout 6) : ?start=N&seed=S ; sans ces paramètres, rien ne change
const qs = new URLSearchParams(location.search);
if (qs.has('start')) api.startLevel = Number(qs.get('start'));
if (qs.has('seed')) api.seed = Number(qs.get('seed'));
window.__inst = window.JDW_GAMES.mouches.mount(document.getElementById('root'), api);
</script>
</body></html>
