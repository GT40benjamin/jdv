<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test rouleaux</title>
<style>html,body{margin:0;height:100%;background:#0b141c;overflow:hidden}#root{position:absolute;inset:0}</style>
</head><body><div id="root"></div>
<script src="../manette.js"></script>
<script src="../games/rouleaux.js"></script>
<script>
function fakeHead(skin, hair, name){
  const c=document.createElement('canvas'); c.width=80; c.height=100; const x=c.getContext('2d');
  x.fillStyle=hair; x.beginPath(); x.ellipse(40,40,34,36,0,0,Math.PI*2); x.fill();
  x.fillStyle=skin; x.beginPath(); x.ellipse(40,54,28,38,0,0,Math.PI*2); x.fill();
  x.fillStyle=hair; x.beginPath(); x.ellipse(40,22,30,14,0,Math.PI,0); x.fill();
  x.fillStyle='#fff'; x.beginPath(); x.ellipse(29,50,6,7,0,0,7); x.ellipse(51,50,6,7,0,0,7); x.fill();
  x.fillStyle='#222'; x.beginPath(); x.arc(30,51,3,0,7); x.arc(52,51,3,0,7); x.fill();
  const sad=document.createElement('canvas'); sad.width=80; sad.height=100; const y=sad.getContext('2d');
  y.drawImage(c,0,0); y.fillStyle=skin; y.fillRect(24,58,32,16);
  y.strokeStyle='#802'; y.lineWidth=3; y.beginPath(); y.arc(40,76,10,Math.PI+0.3,-0.3); y.stroke();
  y.fillStyle='#5ec8ff'; y.beginPath(); y.ellipse(27,62,3,5,0,0,7); y.ellipse(53,62,3,5,0,0,7); y.fill();
  y.fillStyle='#9fb3c1'; y.beginPath(); y.arc(30,8,7,0,7); y.arc(40,6,8,0,7); y.arc(50,8,7,0,7); y.fill();
  // teinte bleue (seulement sur les pixels du visage) + larmes par-dessus
  y.globalCompositeOperation='source-atop'; y.fillStyle='rgba(70,120,210,0.35)'; y.fillRect(0,0,80,100);
  y.globalCompositeOperation='source-over';
  y.fillStyle='#5ec8ff'; y.beginPath(); y.ellipse(27,70,2.5,4,0,0,7); y.ellipse(53,72,2.5,4,0,0,7); y.fill();
  x.strokeStyle='#802'; x.lineWidth=3; x.beginPath(); x.arc(40,64,12,0.2,Math.PI-0.2); x.stroke();
  return { name, img: c, sad };
}
const WITH_HEADS = /heads=1/.test(location.search);
const NO_SAD = /nosad=1/.test(location.search);
const HEADS = (WITH_HEADS ? [fakeHead('#f2c9a0','#5a3a1a','PATOU'), fakeHead('#c98f63','#111','LULU'), fakeHead('#ffd9c0','#e0a020','MAX')] : []).map(h => NO_SAD ? { name: h.name, img: h.img } : h);
window.__celebrate = [];
const api = {
  heads(){ return HEADS.slice(); },
  player: { name: 'PATOU', img: HEADS[0] ? HEADS[0].img : null },
  celebrate(text, name){
    window.__celebrate.push([text, name]);
    if (!HEADS.length) return;
    const h = HEADS.find(q => q.name === name) || HEADS[0];
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:50%;top:30%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:8px;pointer-events:none;font:700 16px sans-serif;color:#13212c';
    const im = document.createElement('img'); im.src = h.img.toDataURL(); im.style.height = '90px';
    const b = document.createElement('div'); b.textContent = text; b.style.cssText = 'background:#fff;border-radius:12px;padding:8px 12px';
    d.appendChild(im); d.appendChild(b); document.body.appendChild(d);
    setTimeout(() => d.remove(), 2500);
  },
  gameOver(s){ console.log('GAMEOVER', s); window.__gameover = (window.__gameover||0)+1; window.__score = s; },
  audio: { tone(){ window.__tones=(window.__tones||0)+1; }, noise(){ window.__noises=(window.__noises||0)+1; } },
  fonts: { display: "'Bungee', Impact, sans-serif", body: "'Chakra Petch', system-ui, sans-serif" },
  colors: { night:'#0b141c', panel:'#111d27', steel:'#22394a', steel2:'#3a5568', ink:'#e9f0f3', muted:'#8aa0ae', amber:'#ffa630', gold:'#ffd34d', alarm:'#ff4d5e', volt:'#5ef0ff', spray:'#ff5fae', leaf:'#4cc36a' }
};
// départ à un niveau et graine (outils de test, CONTRACT.md Ajout 6) : ?start=N&seed=S (sans ces paramètres, rien ne change)
const QS = new URLSearchParams(location.search);
if (QS.has('start')) api.startLevel = Number(QS.get('start'));
if (QS.has('seed')) api.seed = Number(QS.get('seed'));
if (window.JDW_PAD && !api.pad) api.pad = JDW_PAD.gameApi();   // manettes (CONTRACT.md Ajout 10)
window.__inst = window.JDW_GAMES.rouleaux.mount(document.getElementById('root'), api);
</script></body></html>
