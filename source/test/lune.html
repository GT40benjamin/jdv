<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Test Seul sur la Lune</title>
<style>html,body{margin:0;height:100%;background:#0b141c;overflow:hidden}#root{position:absolute;inset:0}</style>
</head><body>
<div id="root"></div>
<script>window.JDW_ROOT = '../../';</script>
<script src="../games/lune.js"></script>
<script>
const MUET = /[?&]muet/.test(location.search);   // banc d'essai sans son
window.__over = [];
let AC = null;
const api = {
  heads: () => [], player: { name: 'PATOU', img: null }, celebrate() {},
  fonts: { display: "'Bungee', Impact, sans-serif", body: "'Chakra Petch', system-ui, sans-serif" },
  gameOver(s) { console.log('GAMEOVER', s); window.__over.push(s); },
  audio: {
    tone(f, d, type, vol, f2) { try { AC = AC || new AudioContext(); const o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'square'; o.frequency.setValueAtTime(f, AC.currentTime); if (f2) o.frequency.linearRampToValueAtTime(f2, AC.currentTime + d); g.gain.setValueAtTime(vol || 0.08, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d); o.connect(g).connect(MUET ? AC.createGain() : AC.destination); o.start(); o.stop(AC.currentTime + d); } catch (e) {} },
    noise() {},
    // comme la borne : decode() une fois, play() ensuite ; window.__sons garde la trace des sons joués (essais)
    sample: {
      decode(ab) { AC = AC || new AudioContext(); return AC.decodeAudioData(ab); },
      play(buf, vol, rate) { (window.__sons = window.__sons || []).push([buf.duration.toFixed(2), +(+vol).toFixed(2), +(+rate || 1).toFixed(2)]); try { const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = buf; s.playbackRate.value = rate || 1; g.gain.value = vol; s.connect(g).connect(MUET ? AC.createGain() : AC.destination); s.start(); } catch (e) {} return true; }
    }
  }
};
// une fausse manette pour les essais : __pad.appui('a'), __pad.stick(x, y)
window.__pad = { n: {}, lx: 0, ly: 0, appui(b) { this.n[b] = (this.n[b] || 0) + 1; }, stick(x, y) { this.lx = x; this.ly = y; } };
api.pad = { get: () => ({ on: true, lx: __pad.lx, ly: __pad.ly, held: {} }), pressed: b => { const k = __pad.n[b] || 0; __pad.n[b] = 0; return k; }, active: () => true };
window.__game = window.JDW_GAMES.lune.mount(document.getElementById('root'), api);
</script>
</body></html>
