<title>Borne d'arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--night:#0b141c;--wall:#14222e;--grout:#0a1218;--ink:#e9f0f3;--muted:#8aa0ae;--amber:#ffa630;--alarm:#ff4d5e;--enamel:#f3f6f4;--enamel-ink:#16313d;--panel:#111d27;--line:#22394a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;padding:16px;font:16px system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background-color:var(--wall);
  background-image:linear-gradient(var(--grout) 2px,transparent 2px),linear-gradient(90deg,var(--grout) 2px,transparent 2px);background-size:46px 46px}
.box{width:100%;max-width:380px;display:grid;gap:14px;padding:24px 22px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5)}
h1{margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:.25em;font:900 clamp(34px,10vw,46px)/1 Impact,"Arial Black",system-ui,sans-serif;letter-spacing:.01em}
h1 b{display:inline-block;padding:.06em .28em 0;border-radius:.16em;background:var(--enamel);color:var(--enamel-ink);font-weight:900}
p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
input{width:100%;font:600 18px system-ui,sans-serif;color:var(--ink);background:var(--night);border:1px solid #3a5568;border-radius:10px;padding:13px 14px}
button{appearance:none;border:0;border-radius:10px;padding:14px;font:800 16px system-ui,sans-serif;background:var(--amber);color:var(--night);cursor:pointer}
button:disabled{opacity:.6}
input:focus-visible,button:focus-visible{outline:3px solid #5ef0ff;outline-offset:2px}
.err{color:var(--alarm);min-height:1.2em;font-size:14px}
</style></head>
<body>
<div class="box" id="box">
  <h1>L'appli <b>Android</b></h1>
  <p>Entre le mot de passe de la bande pour télécharger l'appli Borne d'arcade.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Mot de passe" enterkeyhint="go" aria-label="Mot de passe">
  <button id="go" type="button">Entrer</button>

</div>

    btn.disabled = false; btn.textContent = 'Entrer';
    if (!silent) { err.textContent = 'Mauvais mot de passe. Demande-le à la bande.'; document.getElementById('pw').select(); }
    else if (pw === saved) { try { localStorage.removeItem('jdw.code'); } catch (e2) {} }
    return false;
  }
}
document.getElementById('go').addEventListener('click', () => attempt(document.getElementById('pw').value.trim()));
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') attempt(e.target.value.trim()); });
// essaie le mot de passe de l'appli, puis celui retenu sur l'appareil (l'ancienne appli peut avoir un mot de passe périmé)
(async () => {
  const tries = [];
  try { if (window.BorneApp && BorneApp.code) tries.push(BorneApp.code()); } catch (e) {}
  if (saved && !tries.includes(saved)) tries.push(saved);
  for (const t of tries) if (t && await attempt(t, true)) return;
  document.getElementById('pw').focus();
})();
</script>
