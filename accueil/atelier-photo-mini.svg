<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Miniature de l'ATELIER PHOTO (le modèle des ateliers, 7 nov.) : un appareil photo dans un studio lumineux, jamais une manette -->
  <defs>
    <linearGradient id="fd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9a0"/><stop offset=".5" stop-color="#ff9fbf"/><stop offset="1" stop-color="#8d6bff"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="corps" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3d6e"/><stop offset="1" stop-color="#231a3d"/>
    </linearGradient>
    <linearGradient id="dessus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b4c85"/><stop offset="1" stop-color="#3a2e5e"/>
    </linearGradient>
    <radialGradient id="verre" cx=".38" cy=".34" r=".75">
      <stop offset="0" stop-color="#bfe6ff"/><stop offset=".35" stop-color="#5b8cff"/><stop offset=".7" stop-color="#3a2a9e"/><stop offset="1" stop-color="#140d33"/>
    </radialGradient>
    <linearGradient id="bague" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1fb"/><stop offset=".5" stop-color="#a99cc9"/><stop offset="1" stop-color="#5d5180"/>
    </linearGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2a1040" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="44" fill="url(#fd)"/>
  <rect width="256" height="256" rx="44" fill="url(#halo)"/>
  <!-- deux softbox de studio, floues au loin -->
  <g opacity=".55">
    <rect x="18" y="26" width="46" height="58" rx="10" fill="#fff"/>
    <rect x="192" y="26" width="46" height="58" rx="10" fill="#fff"/>
    <rect x="39" y="84" width="4" height="60" fill="#fff"/>
    <rect x="213" y="84" width="4" height="60" fill="#fff"/>
  </g>
  <!-- l'appareil -->
  <g filter="url(#ombre)">
    <path d="M92 70h48l10 16h46a20 20 0 0 1 20 20v76a20 20 0 0 1-20 20H60a20 20 0 0 1-20-20v-76a20 20 0 0 1 20-20h22z" fill="url(#corps)"/>
    <path d="M92 70h48l10 16H82z" fill="url(#dessus)"/>
    <rect x="54" y="96" width="30" height="12" rx="6" fill="#ffcf6b"/>
    <circle cx="188" cy="104" r="7" fill="#ff6b8a"/>
    <rect x="40" y="128" width="176" height="10" fill="#000" opacity=".18"/>
    <circle cx="128" cy="144" r="50" fill="url(#bague)"/>
    <circle cx="128" cy="144" r="41" fill="#1b1430"/>
    <circle cx="128" cy="144" r="34" fill="url(#verre)"/>
    <circle cx="128" cy="144" r="16" fill="#0d0820" opacity=".55"/>
    <ellipse cx="114" cy="128" rx="11" ry="7" fill="#fff" opacity=".85" transform="rotate(-30 114 128)"/>
    <circle cx="143" cy="158" r="4" fill="#fff" opacity=".5"/>
  </g>
  <!-- une étincelle -->
  <path d="M206 168l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#fff" opacity=".95"/>
  <path d="M58 196l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fff" opacity=".8"/>
</svg>
